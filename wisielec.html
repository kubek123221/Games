<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisielec</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🎯 Gra Wisielec</h1>

  <!-- Przycisk zmiany języka -->
  <button id="langToggle">Polsk🇵🇱</button>

  <!-- Wybór kategorii -->
  <div id="category-select">
    <h2>Kategorie</h2>
    <button onclick="selectCategory('misc')">Różne</button>
    <button onclick="selectCategory('games')">Gry</button>
  </div>

  <!-- Gra -->
  <div id="game" style="display:none">
    <div id="category"></div>
    <pre id="stages"></pre>
    <div id="word"></div>
    <div id="letters"></div>
    <div id="message"></div>

    <!-- Przyciski -->
    <button id="restart">🔄 Zagraj ponownie</button>
    <button id="rematch" style="display:none">♻ Rewanż</button>
    <button id="twoPlayers">👥 2 Gracze</button>

    <!-- Scoreboard -->
    <div id="scoreboard" style="display:none">
      <table>
        <tr>
          <th>Gracz 1</th>
          <th>Gracz 2</th>
        </tr>
        <tr>
          <td id="player1Score">0</td>
          <td id="player2Score">0</td>
        </tr>
      </table>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
